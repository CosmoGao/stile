name: container

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Image name
        id: image
        run: echo "name=ghcr.io/cosmogao/stile" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      # Apache Guacamole Server tag 1.4.0 (annotated tag; commit be9041fefd9c1f7c647845aa0709caedcb54e812).
      # Dockerfile is at the repository root. The stages are "builder" and an unnamed final stage;
      # there is no target named guacd, so this step does not set target. The final stage is the guacd image.
      # Upstream source is used as-is and is not copied into this repository.
      - name: Build and push guacd
        uses: docker/build-push-action@v7
        with:
          context: https://github.com/apache/guacamole-server.git#1.4.0
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/cosmogao/guacd:1.4.0
            ghcr.io/cosmogao/guacd:${{ github.sha }}
