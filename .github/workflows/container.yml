name: container

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Image name
        id: image
        run: echo "name=ghcr.io/cosmogao/stile" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr.io
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}

      # Apache Guacamole Server tag 1.4.0 (annotated tag; commit be9041fefd9c1f7c647845aa0709caedcb54e812).
      # Source is cloned here and is not committed. The Dockerfile apt lines are rewritten to
      # archive.debian.org because Debian 10 is no longer on deb.debian.org. Guacamole source is not changed.
      # There is no build target named guacd; the final stage is the image.
      - name: Prepare guacd 1.4.0 source
        run: |
          git clone --depth 1 --branch 1.4.0 https://github.com/apache/guacamole-server.git guacd-src
          test "$(git -C guacd-src rev-parse HEAD)" = "be9041fefd9c1f7c647845aa0709caedcb54e812"
          python3 docker/prepare-guacd-dockerfile.py guacd-src/Dockerfile

      - name: Build and push guacd
        uses: docker/build-push-action@v7
        with:
          context: guacd-src
          file: guacd-src/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/cosmogao/guacd:1.4.0
            ghcr.io/cosmogao/guacd:${{ github.sha }}
