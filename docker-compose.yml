# stile 的镜像名是 ghcr.io/cosmogao/stile:latest。
# 本机 `docker compose up --build` 用当前源码构建并打上这个标签。
# guacd 使用 ghcr.io/cosmogao/guacd:1.4.0。这个镜像由工作流用 Apache Guacamole Server 上游 1.4.0 源码原样构建，源码不在本仓库，也没有修改。
services:
  stile:
    build: .
    image: ghcr.io/cosmogao/stile:latest
    environment:
      GUACD_ADDRESS: guacd:4822
      STILE_LISTEN: "0.0.0.0:8080"
      STILE_DATABASE: /data/Stile.db
      STILE_MASTER_KEY: /data/master.key
      # 登录凭证有效期、失败锁定次数和锁定时长都还没有定。
      # 下面三个值只是示例，不是产品规则。
      STILE_SESSION_TTL: "12h"
      STILE_LOCKOUT_FAILURES: "4"
      STILE_LOCKOUT_DURATION: "20m"
    ports:
      - "8080:8080"
    volumes:
      - stile-data:/data
    depends_on:
      - guacd

  guacd:
    image: ghcr.io/cosmogao/guacd:1.4.0

volumes:
  stile-data:
